<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/colorbrewer@1.7.0/index.js"></script>
<link rel="stylesheet" href="../../dist/d3.easygraph.css">
<script src="../../dist/d3.easygraph.min.js"></script>
<style>#wrap { width: 600px; }</style>
</head>
<body>
<div id="wrap"><div id="graph"></div></div>
<script>
window.testData = [
  { x: 0, y: 0, value: 5000 },  // band 0: 0-10000
  { x: 1, y: 1, value: 15000 }, // band 1: 10000-20000
  { x: 2, y: 2, value: 25000 }, // band 2: 20000-30000
  { x: 3, y: 3, value: 32000 }, // band 3: 30000-40000
  { x: 4, y: 4, value: 38000 }  // also band 3 -- should match the point above's color
                                 // exactly, not a further-interpolated shade
];

window.graph = d3.easygraph.scatter({
  container:    "#graph",
  label:        " ",
  x:            { scale: "linear" },
  y:            { scale: "linear" },
  color:        { domain: [0, 40000], quantize: true },
  colorPalette: "Blues",
  colorClasses: 4,
  height:       320,
  margin:       { top: 10, right: 14, bottom: 30, left: 50 }
});

window.graph.update(window.testData);
</script>
</body>
</html>

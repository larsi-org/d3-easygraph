<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<link rel="stylesheet" href="../../dist/d3.easygraph.css">
<script src="../../dist/d3.easygraph.min.js"></script>
<style>#wrap { width: 600px; }</style>
</head>
<body>
<div id="wrap"><div id="graph"></div></div>
<script>
// Every value sits in a tight 40-60 range, far inside the fixed [0, 40000] domain below --
// proves the domain used is the fixed one, not one derived from this data.
window.testData = [
  { x: 0, y: 0, value: 40 },
  { x: 1, y: 1, value: 50 },
  { x: 2, y: 2, value: 60 }
];

window.graph = d3.easygraph.scatter({
  container: "#graph",
  label:     " ",
  x:         { scale: "linear" },
  y:         { scale: "linear" },
  // clip alongside domain -- proves domain wins and clip is simply ignored, not combined
  // with it or erroring out
  color:     { domain: [0, 40000], clip: [0.05, 0.95] },
  height:    320,
  margin:    { top: 10, right: 14, bottom: 30, left: 50 }
});

window.graph.update(window.testData);
</script>
</body>
</html>

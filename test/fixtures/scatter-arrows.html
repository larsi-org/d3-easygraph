<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<link rel="stylesheet" href="../../dist/d3.easygraph.css">
<script src="../../dist/d3.easygraph.min.js"></script>
<style>#wrap { width: 600px; }</style>
</head>
<body>
<div id="wrap"><div id="graph"></div></div>
<script>
window.testData = [
  // bearing 90 (east) - points along +x (screen right), short magnitude
  { x: 0,  y: 0,  value: 0,   bearing: 90,         magnitude: 5 },
  // bearing 180 (south) - points along +y (screen down, since svg y grows downward), long magnitude
  { x: 5,  y: 5,  value: 50,  bearing: 180,        magnitude: 20 },
  // no bearing/magnitude - circle only, no arrow glyph
  { x: 10, y: 10, value: 100 }
];

window.graph = d3.easygraph.scatter({
  container: "#graph",
  title:     " ",
  x:         { scale: "linear" },
  y:         { scale: "linear" },
  height:    320,
  margin:    { top: 10, right: 14, bottom: 30, left: 50 },
  arrows:    true
});

window.graph.update(window.testData, { x: [0, 10], y: [0, 10] });
</script>
</body>
</html>

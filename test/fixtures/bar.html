<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<link rel="stylesheet" href="../../dist/d3.easygraph.css">
<script src="../../dist/d3.easygraph.min.js"></script>
<style>#wrap { width: 600px; }</style>
</head>
<body>
<div id="wrap"><div id="graph"></div></div>
<script>
window.testData = [
  [ { category: "Jan", value: 3 }, { category: "Feb", value: 5 }, { category: "Mar", value: 2 } ],
  [ { category: "Jan", value: 4 }, { category: "Feb", value: 1 }, { category: "Mar", value: 6 } ]
];

window.graph = d3.easygraph.bar({
  container:   "#graph",
  title:       " ",
  height:      320,
  margin:      { top: 10, right: 14, bottom: 30, left: 50 },
  orientation: 'vertical',
  stacked:     false
});

window.graph.update(window.testData);
</script>
</body>
</html>
